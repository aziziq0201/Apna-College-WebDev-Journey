<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lists in HTML </title>
</head>
<body>
    <ul>
        <li> Bread</li>
        <li> Jam</li>
        <li> Frooti</li>
        <li> Samosa</li>
        <li> Dosa</li>
    </ul>

    <ol>
        <li> Bread</li>
        <li> Jam</li>
        <li> Frooti</li>
        <li> Samosa</li>
        <li> Dosa</li>
    </ol>

    <ol type="A">
        <li> Bread</li>
        <li> Jam</li>
        <li> Frooti</li>
        <li> Samosa</li>
        <li> Dosa</li>
    </ol>

    <ol type="i">
        <li> Bread
            <ul>
                <li> Brown Bread</li>
                <li> White Bread</li>
            </ul>
        </li>
        <li> Jam</li>
        <li> Frooti</li>
        <li> Samosa</li>
        <li> Dosa</li>
    </ol>

    <a href="https://www.google.com">Google</a>
    <a href="https://www.netflix.com/in">Netflix</a>

    <img src="image.jpg" alt="Random Image" height="300px" width="300px">
</body>
</html>
